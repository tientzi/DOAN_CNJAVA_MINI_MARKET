<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Thông báo lỗi hệ thống')}"></head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card card-minimart p-4 text-center border-top border-4 border-danger">
                <div class="mb-3">
                    <span class="badge bg-danger-subtle text-danger rounded-pill px-3 py-2 fs-6">
                        Mã trạng thái: <span th:text="${errorCode != null ? errorCode : 400}">400</span>
                    </span>
                </div>
                <div class="text-danger display-4 mb-2">
                    <i class="bi bi-exclamation-octagon-fill"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2" th:text="${errorTitle != null ? errorTitle : 'Đã xảy ra lỗi khi xử lý yêu cầu'}">
                    Không thể thực hiện yêu cầu
                </h4>
                <p class="text-secondary mb-3" th:text="${errorMessage != null ? errorMessage : 'Vui lòng kiểm tra lại dữ liệu hoặc quyền truy cập của bạn.'}">
                    Chi tiết lỗi sẽ hiển thị tại đây.
                </p>
                <div th:if="${requestUri}" class="bg-light rounded p-2 mb-4 small text-muted">
                    Đường dẫn yêu cầu: <code th:text="${requestUri}">/mvc/...</code>
                </div>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/mvc}" class="btn btn-minimart px-4">
                        <i class="bi bi-house-door me-1"></i> Về Trang Tổng Quan MVC
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i> Quay lại trang trước
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>

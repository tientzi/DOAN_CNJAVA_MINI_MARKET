<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - MiniMart' : 'MiniMart'}">MiniMart</title>
    <!-- Phát hiện ngay lập tức nếu đang được nhúng bên trong React SPA -->
    <script>
        if (window.self !== window.top) {
            document.documentElement.classList.add('embedded-in-react');
        }
    </script>
    <!-- Google Fonts: Be Vietnam Pro (Đồng bộ 100% với React SPA) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff5722;
            --primary-hover: #e64a19;
            --primary-light: #fbe9e7;
            --secondary: #4caf50;
            --dark: #1e293b;
            --dark-light: #334155;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --radius-md: 0.65rem;
            --radius-lg: 1rem;
        }

        body {
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--gray-50);
            color: var(--dark);
            margin: 0;
            padding: 0;
        }

        /* Container chính đồng nhất, không tạo sidebar thứ 2 khi nhúng trong React SPA */
        .admin-main-container {
            margin-left: 0;
            display: flex;
            flex-direction: column;
            min-height: 100%;
            min-width: 0;
        }

        /* Khi nhúng trực tiếp trong React SPA: ẩn thanh header/menu/footer bao ngoài để hòa làm 1 giao diện duy nhất */
        html.embedded-in-react .standalone-only-chrome {
            display: none !important;
        }

        html.embedded-in-react body {
            background-color: transparent;
            overflow-x: hidden;
        }

        html.embedded-in-react main {
            padding: 0.25rem 0 !important;
        }

        html.embedded-in-react .alerts-wrapper {
            padding: 0 0 0.75rem 0 !important;
        }

        .card-custom {
            background: #ffffff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: box-shadow 0.2s ease;
        }

        .btn-primary-custom {
            background-color: var(--primary);
            border: 1px solid var(--primary);
            color: #ffffff;
            font-weight: 600;
            border-radius: var(--radius-md);
            padding: 0.5rem 1.1rem;
            transition: all 0.2s ease;
        }

        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.25);
        }

        .btn-outline-custom {
            background-color: transparent;
            border: 1.5px solid var(--gray-200);
            color: var(--dark-light);
            font-weight: 600;
            border-radius: var(--radius-md);
            padding: 0.45rem 0.95rem;
            transition: all 0.2s ease;
        }

        .btn-outline-custom:hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: var(--primary-light);
        }

        .thumb-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--gray-200);
        }

        .pagination .page-item.active .page-link {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .pagination .page-link {
            color: var(--dark);
        }
    </style>
</head>
<body>

<!-- ==================== 1. FRAGMENT MENU (THYMELEAF FRAGMENT - TIÊU CHÍ 3.1) ==================== -->
<aside th:fragment="menu" class="standalone-only-chrome bg-dark text-white py-2 px-3 border-bottom">
    <div class="container-fluid d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/}" class="text-decoration-none text-white fw-bold">
                <i class="bi bi-shop me-1" style="color: var(--primary);"></i> MART ADMIN
            </a>
            <nav class="d-flex flex-wrap gap-2 small">
                <a th:href="@{/mvc}" class="text-white-50 text-decoration-none px-2 py-1 rounded"
                   th:classappend="${currentUri == '/mvc' or currentUri == '/mvc/'} ? 'bg-secondary text-white fw-semibold' : ''">Tổng quan</a>
                <a th:href="@{/mvc/products}" class="text-white-50 text-decoration-none px-2 py-1 rounded"
                   th:classappend="${currentUri != null and currentUri.startsWith('/mvc/products')} ? 'bg-secondary text-white fw-semibold' : ''">Sản phẩm</a>
                <a th:if="${isAdmin}" th:href="@{/mvc/categories}" class="text-white-50 text-decoration-none px-2 py-1 rounded"
                   th:classappend="${currentUri != null and currentUri.startsWith('/mvc/categories')} ? 'bg-secondary text-white fw-semibold' : ''">Danh mục</a>
                <a th:if="${isAdmin}" th:href="@{/mvc/suppliers}" class="text-white-50 text-decoration-none px-2 py-1 rounded"
                   th:classappend="${currentUri != null and currentUri.startsWith('/mvc/suppliers')} ? 'bg-secondary text-white fw-semibold' : ''">Nhà cung cấp</a>
                <a th:href="@{/mvc/orders}" class="text-white-50 text-decoration-none px-2 py-1 rounded"
                   th:classappend="${currentUri != null and currentUri.startsWith('/mvc/orders')} ? 'bg-secondary text-white fw-semibold' : ''">Đơn hàng</a>
            </nav>
        </div>
        <a href="/admin" class="btn btn-sm btn-outline-light py-0">Về Bảng điều khiển chính</a>
    </div>
</aside>

<div class="admin-main-container">

    <!-- ==================== 2. FRAGMENT HEADER (THYMELEAF FRAGMENT - TIÊU CHÍ 3.1) ==================== -->
    <header th:fragment="header" class="standalone-only-chrome bg-white border-bottom py-2 px-3">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="fw-semibold small text-secondary" th:text="${pageTitle}">Quản lý</span>
            <span class="badge bg-light text-dark border" th:text="${currentUsername != null ? currentUsername : 'Admin'}">admin</span>
        </div>
    </header>

    <!-- ==================== FRAGMENT ALERTS ==================== -->
    <div th:fragment="alerts" class="alerts-wrapper px-3 pt-2">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show card-custom border-success-subtle shadow-sm d-flex align-items-center mb-2 py-2" role="alert">
            <i class="bi bi-check-circle-fill text-success fs-5 me-2"></i>
            <div class="fw-medium text-dark" th:text="${successMessage}">Thao tác thành công!</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show card-custom border-danger-subtle shadow-sm d-flex align-items-center mb-2 py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill text-danger fs-5 me-2"></i>
            <div class="fw-medium text-dark" th:text="${errorMessage}">Đã xảy ra lỗi!</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- ==================== 3. FRAGMENT FOOTER (THYMELEAF FRAGMENT - TIÊU CHÍ 3.1) ==================== -->
    <footer th:fragment="footer" class="py-2 px-3 mt-2 text-muted small">
        <div class="standalone-only-chrome border-top pt-2 d-flex justify-content-between align-items-center">
            <span>&copy; 2026 <strong>MiniMart Supermarket</strong></span>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:if="${jwtSyncToken != null and userSyncJson != null}" th:inline="javascript">
            /*<![CDATA[*/
            try {
                localStorage.setItem('token', /*[[${jwtSyncToken}]]*/ '');
                localStorage.setItem('user', /*[[${userSyncJson}]]*/ '');
            } catch(e) {}
            /*]]>*/
        </script>
        <!-- Script tự động đồng bộ chiều cao khung nhúng vào React SPA -->
        <script>
            (function() {
                if (window.self === window.top) return;
                function notifyHeight() {
                    var body = document.body;
                    var html = document.documentElement;
                    var height = Math.max(
                        body ? body.scrollHeight : 0,
                        body ? body.offsetHeight : 0,
                        html ? html.offsetHeight : 0
                    );
                    window.parent.postMessage({
                        type: 'THYMELEAF_EMBED_RESIZE',
                        height: height + 24,
                        path: window.location.pathname + window.location.search
                    }, '*');
                }
                window.addEventListener('load', notifyHeight);
                window.addEventListener('resize', notifyHeight);
                if (typeof ResizeObserver !== 'undefined' && document.body) {
                    var ro = new ResizeObserver(notifyHeight);
                    ro.observe(document.body);
                }
                document.addEventListener('shown.bs.modal', function() {
                    window.parent.postMessage({ type: 'THYMELEAF_EMBED_MODAL', open: true }, '*');
                });
                document.addEventListener('hidden.bs.modal', function() {
                    notifyHeight();
                });
                setTimeout(notifyHeight, 150);
                setTimeout(notifyHeight, 500);
            })();
        </script>
    </footer>

</div>

</body>
</html>
